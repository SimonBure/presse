[package]
name = "presse"
version = "0.5.0"
edition = "2024"
authors = ["Simon Buré"]
description = "Fast compression CLI for PDF, JPEG, PNG, WebP and ZIP-based documents (ODT, DOCX, EPUB) — image recompression and structural optimization"
license = "GPL-3.0"
repository = "https://github.com/SimonBure/presse"
homepage = "https://github.com/SimonBure/presse"
keywords = ["pdf", "compression", "cli", "images", "optimization"]
categories = ["command-line-utilities", "compression"]

[package.metadata.wix]
upgrade-guid = "908C4A9D-CBD9-4772-A0DE-B033A3CC9C74"
path-guid = "20B73937-7905-4D33-B513-8D635C4BB57C"
license = false
eula = false

[features]
default = []
# NVIDIA nvJPEG backend (--acceleration cuda). Loads libnvjpeg at runtime via
# baracuda's dynamic loader — no CUDA toolkit needed to build, no link-time
# driver dependency. baracuda-cuda-sys supplies CUDA streams and pinned host
# memory for the async pipeline.
cuda = ["dep:baracuda-nvjpeg-sys", "dep:baracuda-cuda-sys", "dep:libloading"]
# AMD rocJPEG backend (--acceleration rocm). Loads librocjpeg at runtime.
rocm = ["dep:libloading"]
# Extra pure-Rust compressors and optimizers behind default-off CLI flags:
# --jbig2, --jpeg2000, --font-subset, --zopfli, --mrc, --dedup, and the
# --compression presets. Kept out of default builds because the codec crates
# (jbig2enc-rust, j2k) are heavy to compile; the flags fail with an explicit
# "requires a build with the optimize feature" error when absent.
optimize = ["dep:zopfli", "dep:subsetter", "dep:jbig2enc-rust", "dep:j2k"]

[dependencies]
# PDF manipulation
lopdf = "0.44"

# CLI
clap = { version = "4", features = ["derive"] }

# Progress bar
indicatif = "0.17"
# Only the formats presse reads. The default feature set also compiles an
# AVIF *encoder* (rav1e) presse never calls (AVIF *decoding* needs the C
# `avif-native` feature, which was never on) plus niche decoders (EXR, HDR,
# DDS, QOI, TGA, PNM, ICO, Farbfeld).
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
# Writes palette PNGs, which `image` cannot. Same version `image` already
# pulls in, so no new crate.
png = "0.18"
# Lossless WebP encoding (`convert`, and `press` on WebP files). Already
# pulled in by `image`, so no new crate.
image-webp = "0.2"

# Parallel image re-encoding
rayon = "1.12"

# zlib-rs deflate backend (pure Rust, faster than miniz_oxide). flate2 is a
# transitive dep of lopdf/png; enabling `zlib-rs` here makes flate2 prefer it
# over miniz_oxide across the whole graph (see flate2 ffi/mod.rs priority).
flate2 = { version = "1.1", features = ["zlib-rs"] }

# Zero-copy input reads
memmap2 = "0.9"

# Faster allocation for the many small buffers rayon workers create.
mimalloc = "0.1"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }

# GPU backends (optional, see [features])
baracuda-nvjpeg-sys = { version = "0.0.1-alpha.79", optional = true }
baracuda-cuda-sys = { version = "0.0.1-alpha.79", optional = true }
libloading = { version = "0.8", optional = true }
# Pure-Rust optimizers behind the `optimize` feature (default off): Zopfli
# deflate, OpenType font subsetting (typst's subsetter, PDF-tailored), a Rust
# JBIG2 encoder with PDF fragment output, and the j2k JPEG2000/HTJ2K codec.
zopfli = { version = "0.8.3", optional = true }
subsetter = { version = "0.2.6", optional = true }
jbig2enc-rust = { version = "0.5.3", optional = true }
j2k = { version = "0.9.0", optional = true }

[dev-dependencies]
# Same major/minor as the main deps, shared by tests/ and examples/ (corpus generator)
lopdf = "0.44"
# No features of its own: tests decode with exactly the formats that ship.
image = { version = "0.25", default-features = false }
# Test-side inflate of flate-wrapped JPEG streams (lopdf cannot decode DCTDecode).
flate2 = "1.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
