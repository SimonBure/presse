[package]
name = "presse"
version = "0.4.0"
edition = "2024"
authors = ["Simon Buré"]
description = "Fast PDF compression CLI — JPEG recompression and structural optimization"
license = "GPL-3.0"
repository = "https://github.com/SimonBure/presse"
homepage = "https://github.com/SimonBure/presse"
keywords = ["pdf", "compression", "cli", "images", "optimization"]
categories = ["command-line-utilities", "compression"]

[package.metadata.wix]
upgrade-guid = "908C4A9D-CBD9-4772-A0DE-B033A3CC9C74"
path-guid = "20B73937-7905-4D33-B513-8D635C4BB57C"
license = false
eula = false

[features]
default = []
# NVIDIA nvJPEG backend (--acceleration cuda). Loads libnvjpeg at runtime via
# baracuda's dynamic loader — no CUDA toolkit needed to build, no link-time
# driver dependency. baracuda-cuda-sys supplies CUDA streams and pinned host
# memory for the async pipeline.
cuda = ["dep:baracuda-nvjpeg-sys", "dep:baracuda-cuda-sys", "dep:libloading"]
# AMD rocJPEG backend (--acceleration rocm). Loads librocjpeg at runtime.
rocm = ["dep:libloading"]

[dependencies]
# PDF manipulation
lopdf = "0.44"

# CLI
clap = { version = "4", features = ["derive"] }

# Progress bar
indicatif = "0.17"
image = "0.25.9"

# Parallel image re-encoding
rayon = "1.12"

# zlib-rs deflate backend (pure Rust, faster than miniz_oxide). flate2 is a
# transitive dep of lopdf/png; enabling `zlib-rs` here makes flate2 prefer it
# over miniz_oxide across the whole graph (see flate2 ffi/mod.rs priority).
flate2 = { version = "1.1", features = ["zlib-rs"] }

# Zero-copy input reads
memmap2 = "0.9"

# GPU backends (optional, see [features])
baracuda-nvjpeg-sys = { version = "0.0.1-alpha.79", optional = true }
baracuda-cuda-sys = { version = "0.0.1-alpha.79", optional = true }
libloading = { version = "0.8", optional = true }

# Faster allocation for the many small buffers rayon workers create.
mimalloc = "0.1"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }

[dev-dependencies]
# Same major/minor as the main deps, shared by tests/ and examples/ (corpus generator)
lopdf = "0.44"
image = "0.25"
# Test-side inflate of flate-wrapped JPEG streams (lopdf cannot decode DCTDecode).
flate2 = "1.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
